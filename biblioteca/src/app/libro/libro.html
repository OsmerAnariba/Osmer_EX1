<h1>Biblioteca</h1>
<a routerLink="/login">Login</a>
<a routerLink="/libro">Libro</a>

<from>
    <form>
        <label for="titulo">Titulo:</label>
        <input type="text" id="titulo" [(ngModel)]="titulo">
        <br>
        <label for="autor">Autor:</label>
        <input type="text" id="autor" [(ngModel)]="autor">
        <br>
        <label for="anio">Año:</label>
        <input type="number" id="anio" [(ngModel)]="anio">
        <br>
        <button (click)="agregarLibro()">Agregar Libro</button>
</from>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Titulo</th>
            <th>Autor</th>
            <th>Año</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let libro of libros">
            <td>{{ libro.id }}</td>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.autor }}</td>
            <td>{{ libro.anio }}</td>
        </tr>
    </tbody>
